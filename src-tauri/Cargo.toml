[package]
name = "winotch"
version = "0.1.0"
description = "A notch that shows Claude Code activity"
authors = ["Quentin Bruyere"]
license = "GPL-3.0-only"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "winotch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
